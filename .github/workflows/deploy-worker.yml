name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
  workflow_dispatch:
    inputs:
      skip_db_verify:
        description: "Publicar sem confirmar o schema do D1 (use so para mudanca de codigo, ou quando o schema ja foi aplicado a mao)"
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
        working-directory: worker

      # Blocks the deploy when the database does not match schema.sql. The migration
      # files are applied by hand, so without this a forgotten "wrangler d1 execute
      # --remote" ships code against a database that never got its indexes -- which is
      # exactly what happened with the partial layer indexes.
      #
      # Both drift (exit 1) and being unable to check at all (exit 2) now fail the build.
      # Exit 2 used to be a warning, on the reasoning that a permissions gap in an
      # auxiliary check should not take deployment down with it. The rollup changed what
      # is at stake: rollupIsEmpty() is the first await in scheduled(), so a Worker that
      # ships before its tables exist throws on every cron tick -- no checks recorded, no
      # incidents managed, no notifications sent. The monitor goes down entirely, not
      # just its indexes. An unverifiable database is no longer a risk worth deploying
      # through.
      #
      # The usual cause of exit 2 is the deploy token lacking D1:Read; adding that scope
      # is the fix. To ship anyway -- a code-only change, or a deliberate
      # schema-then-code rollout -- run the workflow manually with skip_db_verify.
      - name: Typecheck
        working-directory: worker
        run: npm run typecheck

      - name: Verify database schema
        if: ${{ inputs.skip_db_verify != true }}
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          npm run db:verify
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            echo "::error::O banco divergiu de schema.sql; veja a saida acima."
            exit 1
          elif [ "$code" -ne 0 ]; then
            echo "::error::db:verify nao conseguiu consultar o D1 (exit $code), entao nao da para saber se as tabelas existem. Publicar assim derruba o cron inteiro se o schema estiver atrasado. Provavel causa: o token do deploy nao tem D1:Read. Para publicar mesmo assim, rode o workflow manualmente com skip_db_verify=true."
            exit 1
          fi

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
