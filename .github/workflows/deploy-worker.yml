name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
        working-directory: worker

      # Blocks the deploy when the database does not match schema.sql. The migration
      # files are applied by hand, so without this a forgotten "wrangler d1 execute
      # --remote" ships code against a database that never got its indexes -- which is
      # exactly what happened with the partial layer indexes.
      #
      # Drift (exit 1) fails the build. Being unable to check at all (exit 2) only
      # warns: the token that deploys a Worker does not automatically carry D1:Read, and
      # a permissions gap in an auxiliary check should not take deployment down with it.
      # The warning annotation keeps that state visible instead of silently green.
      - name: Verify database schema
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          npm run db:verify
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            echo "::error::O banco divergiu de schema.sql; veja a saida acima."
            exit 1
          elif [ "$code" -ne 0 ]; then
            echo "::warning::db:verify nao conseguiu consultar o D1 (exit $code). O deploy segue, mas sem a checagem de schema."
          fi

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
